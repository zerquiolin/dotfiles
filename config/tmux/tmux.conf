set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -g escape-time 10
set -g mouse on
set -g history-limit 20000
set -g status-position top
set -g status-style 'bg=default,fg=#a6accd'
set -g status-left '#[fg=#89ddff,bold] Workspace '
set -g status-right '#[fg=#767c9d] #{pane_current_path} '
setw -g window-status-current-style 'fg=#5de4c7,bold'
set -g pane-border-style 'fg=#303340'
set -g pane-active-border-style 'fg=#89ddff'
bind-key P display-popup -E -w 80% -h 80% 'work open'
bind-key B select-pane -L
bind-key n new-window -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'

# Prefix is Ctrl-b. z hides/reveals the sidebar by zooming the current pane.
bind-key z resize-pane -Z

set -s extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# Preserve Ghostty's background image and glass through terminal default colors.
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g popup-style 'bg=default,fg=#a6accd'
set -g popup-border-style 'bg=default,fg=#767c9d'

# Leave keeps the complete live workspace running. Stop is explicit and guarded.
bind-key d detach-client
bind-key Q display-popup -E -w 80% -h 60% 'work stop'
